# AtmoSync Superset Datasets and KPI Metrics Specification
# Defines semantic layers and charts derived from dbt analytical models.

database_name: "AtmoSync Snowflake"

datasets:
  - table_name: "STG_SENSOR_READINGS"
    schema: "STAGING"
    description: "Raw validated container sensor time-series telemetry."
    metrics:
      - metric_name: "avg_temperature"
        verbose_name: "Average Temperature (°C)"
        expression: "AVG(temperature)"
      - metric_name: "max_temperature"
        verbose_name: "Maximum Temperature (°C)"
        expression: "MAX(temperature)"
      - metric_name: "avg_humidity"
        verbose_name: "Average Humidity (%)"
        expression: "AVG(humidity)"
      - metric_name: "max_humidity"
        verbose_name: "Maximum Humidity (%)"
        expression: "MAX(humidity)"
      - metric_name: "vibration_index"
        verbose_name: "Vibration Index (RMS)"
        expression: "SQRT(AVG(vibration * vibration))"
      - metric_name: "total_readings"
        verbose_name: "Total Telemetry Events"
        expression: "COUNT(*)"

  - table_name: "FCT_SPOILAGE_RISK"
    schema: "MARTS"
    description: "Container risk scores and classification based on thermal and environmental thresholds."
    metrics:
      - metric_name: "critical_container_count"
        verbose_name: "Critical Containers Count"
        expression: "COUNT(DISTINCT CASE WHEN risk_level = 'CRITICAL' THEN container_id END)"
      - metric_name: "warning_container_count"
        verbose_name: "Warning Containers Count"
        expression: "COUNT(DISTINCT CASE WHEN risk_level = 'WARNING' THEN container_id END)"
      - metric_name: "at_risk_container_count"
        verbose_name: "Total At-Risk Containers"
        expression: "COUNT(DISTINCT CASE WHEN risk_level IN ('CRITICAL', 'WARNING') THEN container_id END)"
      - metric_name: "avg_spoilage_score"
        verbose_name: "Average Spoilage Score"
        expression: "AVG(spoilage_score)"

  - table_name: "FCT_ARBITRAGE_OPPORTUNITIES"
    schema: "MARTS"
    description: "Latest operational container status and rerouting candidate flags."
    metrics:
      - metric_name: "reroute_candidates_count"
        verbose_name: "Containers Needing Rerouting"
        expression: "COUNT(DISTINCT CASE WHEN is_reroute_candidate = TRUE THEN container_id END)"

  - table_name: "FCT_SENSOR_DATA_QUALITY"
    schema: "MARTS"
    description: "Audit and data-quality profiling mart classifying raw sensor events into PASS, WARNING, or FAIL with granular anomaly flags and issue reasons."
    columns:
      - name: "container_id"
        type: "STRING"
        description: "Monitored container identifier."
      - name: "shipment_id"
        type: "STRING"
        description: "Monitored shipment identifier."
      - name: "commodity"
        type: "STRING"
        description: "Perishable commodity category (Avocados, Mangoes, Bananas)."
      - name: "temperature"
        type: "FLOAT"
        description: "Unpacked temperature in Celsius."
      - name: "humidity"
        type: "FLOAT"
        description: "Unpacked relative humidity percentage."
      - name: "vibration"
        type: "FLOAT"
        description: "Unpacked vibration acceleration in g."
      - name: "recorded_at"
        type: "TIMESTAMP_TZ"
        description: "RFC 3339 event recording timestamp."
      - name: "quality_status"
        type: "STRING"
        description: "Three-tier quality classification: PASS, WARNING, or FAIL."
      - name: "quality_issue_reasons"
        type: "STRING"
        description: "Semicolon-delimited list of detected anomaly codes."
      - name: "duplicate_occurrence_rank"
        type: "NUMBER"
        description: "Rank of event arrival for container and timestamp."
      - name: "is_missing_required_fields"
        type: "NUMBER"
        description: "Boolean flag for missing required fields."
      - name: "is_temperature_physically_impossible"
        type: "NUMBER"
        description: "Boolean flag for temperature outside [-50C, 60C]."
      - name: "is_temperature_operational_anomaly"
        type: "NUMBER"
        description: "Boolean flag for temperature departure outside [0C, 25C]."
      - name: "is_humidity_out_of_bounds"
        type: "NUMBER"
        description: "Boolean flag for humidity outside [0, 100]."
      - name: "is_humidity_near_saturation"
        type: "NUMBER"
        description: "Boolean flag for humidity > 95%."
      - name: "is_vibration_negative"
        type: "NUMBER"
        description: "Boolean flag for vibration < 0.0."
      - name: "is_vibration_shock_alert"
        type: "NUMBER"
        description: "Boolean flag for shock vibration > 0.50g."
      - name: "is_timestamp_missing"
        type: "NUMBER"
        description: "Boolean flag for missing timestamp."
      - name: "is_timestamp_future"
        type: "NUMBER"
        description: "Boolean flag for clock drift > 5 mins in future."
      - name: "is_duplicate_event"
        type: "NUMBER"
        description: "Boolean flag for duplicate event arrival."
      - name: "is_unknown_commodity"
        type: "NUMBER"
        description: "Boolean flag for unrecognised commodity."
    metrics:
      - metric_name: "total_sensor_readings"
        verbose_name: "Total Sensor Readings"
        expression: "COUNT(*)"
      - metric_name: "pass_reading_count"
        verbose_name: "PASS Readings Count"
        expression: "COUNT(CASE WHEN quality_status = 'PASS' THEN 1 END)"
      - metric_name: "warning_reading_count"
        verbose_name: "WARNING Readings Count"
        expression: "COUNT(CASE WHEN quality_status = 'WARNING' THEN 1 END)"
      - metric_name: "fail_reading_count"
        verbose_name: "FAIL Readings Count"
        expression: "COUNT(CASE WHEN quality_status = 'FAIL' THEN 1 END)"
      - metric_name: "quality_pass_rate"
        verbose_name: "Data Quality Pass Rate (%)"
        expression: "(COUNT(CASE WHEN quality_status = 'PASS' THEN 1 END) * 100.0) / NULLIF(COUNT(*), 0)"
      - metric_name: "quality_fail_rate"
        verbose_name: "Data Quality Failure Rate (%)"
        expression: "(COUNT(CASE WHEN quality_status = 'FAIL' THEN 1 END) * 100.0) / NULLIF(COUNT(*), 0)"
      - metric_name: "warning_or_failed_containers_count"
        verbose_name: "Containers with Warnings or Failures"
        expression: "COUNT(DISTINCT CASE WHEN quality_status IN ('WARNING', 'FAIL') THEN container_id END)"
      - metric_name: "quality_issue_records_count"
        verbose_name: "Records with Quality Issues"
        expression: "COUNT(CASE WHEN quality_issue_reasons IS NOT NULL AND TRIM(quality_issue_reasons) != '' THEN 1 END)"

charts:
  - slice_name: "Current Thermal Index"
    viz_type: "big_number_total"
    dataset: "STG_SENSOR_READINGS"
    metric: "avg_temperature"
  - slice_name: "Current Relative Humidity"
    viz_type: "big_number_total"
    dataset: "STG_SENSOR_READINGS"
    metric: "avg_humidity"
  - slice_name: "Transit Vibration Index"
    viz_type: "big_number_total"
    dataset: "STG_SENSOR_READINGS"
    metric: "vibration_index"
  - slice_name: "At-Risk Containers"
    viz_type: "big_number_total"
    dataset: "FCT_SPOILAGE_RISK"
    metric: "at_risk_container_count"
  - slice_name: "Temperature Trend over Transit"
    viz_type: "echarts_timeseries_line"
    dataset: "STG_SENSOR_READINGS"
    time_column: "recorded_at"
    dimensions: ["container_id"]
    metrics: ["avg_temperature"]
  - slice_name: "Humidity Trend over Transit"
    viz_type: "echarts_timeseries_line"
    dataset: "STG_SENSOR_READINGS"
    time_column: "recorded_at"
    dimensions: ["container_id"]
    metrics: ["avg_humidity"]
  - slice_name: "Vibration Intensity Distribution"
    viz_type: "echarts_area"
    dataset: "STG_SENSOR_READINGS"
    time_column: "recorded_at"
    dimensions: ["commodity"]
    metrics: ["vibration_index"]
  - slice_name: "Spoilage Risk Classification Breakdown"
    viz_type: "pie"
    dataset: "FCT_SPOILAGE_RISK"
    dimensions: ["risk_level"]
    metrics: ["COUNT(*)"]
  - slice_name: "At-Risk Shipments Requiring Intervention"
    viz_type: "table"
    dataset: "FCT_ARBITRAGE_OPPORTUNITIES"
    columns:
      - "container_id"
      - "shipment_id"
      - "commodity"
      - "temperature"
      - "humidity"
      - "vibration"
      - "risk_level"
      - "spoilage_score"
      - "logistics_action_recommendation"

  # Data Quality Monitoring Visualizations
  - slice_name: "Data Quality Status Distribution"
    viz_type: "pie"
    dataset: "FCT_SENSOR_DATA_QUALITY"
    dimensions: ["quality_status"]
    metrics: ["COUNT(*)"]

  - slice_name: "Data Quality Trend over Time"
    viz_type: "echarts_timeseries_line"
    dataset: "FCT_SENSOR_DATA_QUALITY"
    time_column: "recorded_at"
    dimensions: ["quality_status"]
    metrics: ["COUNT(*)"]

  - slice_name: "Most Frequent Quality Issue Reasons"
    viz_type: "echarts_bar"
    dataset: "FCT_SENSOR_DATA_QUALITY"
    dimensions: ["quality_issue_reasons"]
    metrics: ["quality_issue_records_count"]

  - slice_name: "Container-wise Quality Status Breakdown"
    viz_type: "echarts_bar"
    dataset: "FCT_SENSOR_DATA_QUALITY"
    dimensions: ["container_id", "quality_status"]
    metrics: ["COUNT(*)"]

  - slice_name: "Commodity-wise Quality Status Breakdown"
    viz_type: "echarts_bar"
    dataset: "FCT_SENSOR_DATA_QUALITY"
    dimensions: ["commodity", "quality_status"]
    metrics: ["COUNT(*)"]

  - slice_name: "Sensor Anomaly Audit Log"
    viz_type: "table"
    dataset: "FCT_SENSOR_DATA_QUALITY"
    columns:
      - "container_id"
      - "shipment_id"
      - "commodity"
      - "recorded_at"
      - "temperature"
      - "humidity"
      - "vibration"
      - "quality_status"
      - "quality_issue_reasons"

filters:
  - filter_name: "Date Range"
    column: "recorded_at"
    filter_type: "time_range"
    targets:
      - "STG_SENSOR_READINGS"
      - "FCT_SPOILAGE_RISK"
      - "FCT_ARBITRAGE_OPPORTUNITIES"
      - "FCT_SENSOR_DATA_QUALITY"
  - filter_name: "Container ID"
    column: "container_id"
    filter_type: "select"
    targets:
      - "STG_SENSOR_READINGS"
      - "FCT_SPOILAGE_RISK"
      - "FCT_ARBITRAGE_OPPORTUNITIES"
      - "FCT_SENSOR_DATA_QUALITY"
  - filter_name: "Commodity"
    column: "commodity"
    filter_type: "select"
    targets:
      - "STG_SENSOR_READINGS"
      - "FCT_SPOILAGE_RISK"
      - "FCT_ARBITRAGE_OPPORTUNITIES"
      - "FCT_SENSOR_DATA_QUALITY"
  - filter_name: "Quality Status"
    column: "quality_status"
    filter_type: "select"
    targets:
      - "FCT_SENSOR_DATA_QUALITY"
