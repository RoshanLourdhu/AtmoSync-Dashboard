# ==============================================================================
# AtmoSync dbt Project Configuration
# Project: my_dbt_project (Nisha Data Transformation Layer)
# ==============================================================================

name: 'my_dbt_project'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
# Must match the root key in /home/nisha/.dbt/profiles.yml
profile: 'my_dbt_project'

# Directory configuration paths
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Model materialization configurations
# - example: Starter views for setup testing
# - staging: Deduplicated, typed views over Snowflake raw sources
# - marts: Persisted analytical tables for reporting and arbitrage logic
models:
  my_dbt_project:
    example:
      +materialized: view
    staging:
      +materialized: view
    marts:
      +materialized: table
