version: 2

models:
  - name: my_first_dbt_model
    description: "First example dbt model"

  - name: my_second_dbt_model
    description: "Second example dbt model"

  - name: stg_customer
    description: "Customer staging model"

  - name: stg_sensor
    description: "Sensor staging model"

  - name: stg_commodity
    description: "Commodity staging model"

  - name: fct_commodity_condition
    description: "Commodity condition analytics model"

  - name: fct_commodity_spoilage
    description: "Commodity spoilage analytics model"
    columns:
      - name: COMMODITY_ID
        data_tests:
          - not_null
      - name: SHELF_LIFE_DAYS
        data_tests:
          - not_null
      - name: DAYS_STORED
        data_tests:
          - not_null
      - name: SPOILAGE_PERCENTAGE
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 100]

  - name: fct_commodity_arbitrage
    description: "Commodity arbitrage analytics model"
    columns:
      - name: COMMODITY_NAME
        data_tests:
          - not_null
      - name: BUY_LOCATION
        data_tests:
          - not_null
      - name: SELL_LOCATION
        data_tests:
          - not_null
      - name: BUY_PRICE
        data_tests:
          - not_null
      - name: SELL_PRICE
        data_tests:
          - not_null
      - name: PRICE_DIFFERENCE
        data_tests:
          - not_null
      - name: ARBITRAGE_STATUS
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Opportunity
                  - No Opportunity

  - name: fct_commodity_data_quality
    description: "Commodity data quality analytics model"
    columns:
      - name: COMMODITY_ID
        data_tests:
          - not_null
      - name: DATA_QUALITY_STATUS
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Valid
                  - Missing Commodity Name
                  - Missing Category
                  - Missing Price
                  - Invalid Price
                  - Missing Quantity
                  - Invalid Quantity
                  - Missing Location
      - name: IS_VALID_RECORD
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]