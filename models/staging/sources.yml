version: 2

sources:
  - name: tpch_source
    database: "{{ env_var('SNOWFLAKE_SAMPLE_DB', 'SNOWFLAKE_SAMPLE_DATA') }}"
    schema: TPCH_SF1
    description: "Snowflake shared benchmark sample dataset used for customer reference."
    tables:
      - name: CUSTOMER
        description: "Customer dimension reference table from TPC-H sample data."
        columns:
          - name: C_CUSTKEY
            description: "Primary key identifier for the customer."
          - name: C_NAME
            description: "Full name of the customer."

  - name: sensor_source
    database: "{{ env_var('SNOWFLAKE_DATABASE', 'SNOWFLAKE_LEARNING_DB') }}"
    schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'PUBLIC') }}"
    description: "Cold-chain IoT telemetry landing layer for environmental sensor readings."
    tables:
      - name: RAW_SENSOR
        description: "Raw IoT environmental sensor telemetry readings."
        columns:
          - name: SENSOR_ID
            description: "Unique identifier for the cold chain sensor hardware."
          - name: SENSOR_NAME
            description: "Descriptive label or model of the sensor unit."
          - name: TEMPERATURE
            description: "Ambient container temperature recorded in Celsius."
          - name: HUMIDITY
            description: "Relative humidity percentage recorded inside the container."
          - name: RECORDED_AT
            description: "UTC timestamp when the sensor measurement was captured."

  - name: commodity_source
    database: "{{ env_var('SNOWFLAKE_DATABASE', 'SNOWFLAKE_LEARNING_DB') }}"
    schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'PUBLIC') }}"
    description: "Perishable commodity master data and inventory registry."
    tables:
      - name: RAW_COMMODITY
        description: "Raw commodity reference table storing pricing, inventory volume, and categories."
        columns:
          - name: COMMODITY_ID
            description: "Unique commodity inventory SKU identifier."
          - name: COMMODITY_NAME
            description: "Commodity trade name (e.g., Mangoes, Apples, Tomatoes)."
          - name: CATEGORY
            description: "Commodity classification (Fruits, Grains, Vegetables)."
          - name: PRICE
            description: "Current spot or contract market unit price."
          - name: QUANTITY
            description: "Current inventory volume count or weight."
          - name: LOCATION
            description: "Warehouse, port, or container transit origin/destination."
          - name: RECORDED_AT
            description: "Timestamp when the inventory pricing record was created."
